[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "QuantTrading"
version = "0.1.0"
description = "Quant trading research codebase"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "pyarrow>=14.0",
  "fastparquet>=2023.0",
  "PyYAML>=6.0.0",
  "requests>=2.28",
]

[project.optional-dependencies]
prediction = [
  "scikit-learn>=1.3",
  "xgboost>=1.7",
  "torch>=2.0",
  "matplotlib>=3.7",
  "jupyter>=1.0",
  "joblib>=1.3",
  "seaborn>=0.12",
  "plotly>=5.0",
]
collector = [
  "aiohttp>=3.9.0",
  "websockets>=12,<17",
  "orjson>=3.9.0",
  "zstandard>=0.22.0",
]
trading = [
  "alpaca-trade-api==3.2.0",
  "polygon-api-client==1.14.4",
]
research = [
  "polars>=0.20",
  "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
